name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is deliberately offline. Reproducing the measurements needs
      # Kafka, a Flink cluster, MinIO, an Iceberg REST catalog and Trino, and
      # over an hour of wall clock; asserting them does not. The tests cover
      # the measurement logic as pure functions and the shipped results/*.json
      # as evidence, so CI stays fast and never depends on a container
      # registry being up.
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10"

      - run: python -m pytest -q

      # Every number in the README is re-derived from results/*.json and must
      # appear verbatim. A re-run that shifts a byte figure fails here rather
      # than leaving the document quietly wrong.
      - name: README numbers match the shipped results
        run: python scripts/check_readme_numbers.py
