version: 2
updates:
  # The workflow pins each action to a commit SHA, so a moved tag cannot
  # change what CI runs. This entry is what keeps those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # The Flink base image, pinned by digest in stack/flink/Dockerfile. A pull
  # request when the tag moves; a person decides whether to take it.
  - package-ecosystem: "docker"
    directory: "/stack/flink"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
